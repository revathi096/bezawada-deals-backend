<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BezawadaDeals</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen font-sans">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900">Bezawada<span class="text-rose-600">Deals</span></h1>
            <p class="text-xs text-slate-500 mt-1">Authorized Admin Access Only</p>
        </div>

        {% if error %}
        <div class="bg-rose-100 text-rose-700 text-xs p-3 rounded mb-4 font-semibold text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="font-bold text-slate-700 block mb-1">Username</label>
                <input type="text" name="username" required placeholder="Enter username" class="w-full p-2.5 border rounded focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>
            <div>
                <label class="font-bold text-slate-700 block mb-1">Password</label>
                <input type="password" name="password" required placeholder="Enter password" class="w-full p-2.5 border rounded focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>
            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded transition text-sm">Secure Login</button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-slate-500 hover:underline">← Back to Homepage</a>
        </div>
    </div>
</body>
</html>
