<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BezawadaDeals - Vijayawada's Premier Shopping & Food Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-rose-600 tracking-tight">BezawadaDeals</h1>
            <nav class="hidden md:flex space-x-6 text-sm font-semibold text-slate-600">
                <a href="#" class="hover:text-rose-600 transition">Home</a>
                <a href="#categories" class="hover:text-rose-600 transition">Categories</a>
                <a href="#deals" class="hover:text-rose-600 transition">Top Deals</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-rose-900 to-rose-700 text-white py-16 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-4xl font-extrabold mb-4 tracking-tight">Vijayawada's Premier Deal Hub</h2>
            <p class="text-rose-100 text-lg mb-8">Discover exclusive offers from PVP Mall, Trendset, RS Brothers, Kalamandir, and top local stores.</p>
            <div class="bg-white p-2 rounded-xl shadow-lg max-w-xl mx-auto flex">
                <input type="text" id="searchInput" placeholder="Search clothes, food, accessories..." class="w-full px-4 py-2 text-slate-700 focus:outline-none rounded-l-lg">
                <button class="bg-rose-600 hover:bg-rose-700 text-white px-6 py-2 rounded-r-lg font-semibold transition">Search</button>
            </div>
        </div>
    </section>

    <!-- Categories Section -->
    <main class="max-w-7xl mx-auto px-4 py-12" id="categories">
        <h3 class="text-2xl font-bold mb-6 text-slate-900">Explore Categories</h3>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center hover:shadow-md transition cursor-pointer">
                <div class="text-3xl mb-2">👗</div>
                <h4 class="font-bold text-slate-800">Clothes</h4>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center hover:shadow-md transition cursor-pointer">
                <div class="text-3xl mb-2">🍔</div>
                <h4 class="font-bold text-slate-800">Food</h4>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center hover:shadow-md transition cursor-pointer">
                <div class="text-3xl mb-2">💍</div>
                <h4 class="font-bold text-slate-800">Accessories</h4>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center hover:shadow-md transition cursor-pointer">
                <div class="text-3xl mb-2">🎮</div>
                <h4 class="font-bold text-slate-800">Games</h4>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center hover:shadow-md transition cursor-pointer">
                <div class="text-3xl mb-2">🛒</div>
                <h4 class="font-bold text-slate-800">Daily Needs</h4>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-8 text-center text-slate-500 text-sm mt-12">
        <p>&copy; 2026 BezawadaDeals. All rights reserved.</p>
    </footer>
</body>
</html>
