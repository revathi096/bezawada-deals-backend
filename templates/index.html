
<!-- BEZAWADADEALS WARD MARKETPLACE -->
<section id="ward-marketplace" class="bd-marketplace">

  <div class="bd-topbar">
    <button id="bdBack" class="bd-back">← Back</button>
    <button id="bdDashboard" class="bd-dashboard">My Dashboard</button>
  </div>

  <h2>Vijayawada Local Deals</h2>
  <p>మీ ప్రాంతంలోని తాజా Offers & Market Prices</p>

  <div class="bd-filter-box">
    <label>Select Area</label>
    <select id="bdArea">
      <option value="">All Areas</option>
      <option>Patamata</option>
      <option>Benz Circle</option>
      <option>Labbipet</option>
      <option>Rythu Bazaar</option>
      <option>K.R. Market</option>
      <option>Governorpet</option>
      <option>Poranki</option>
      <option>Kanuru</option>
      <option>Ramavarappadu</option>
      <option>Gunadala</option>
      <option>Bhavanipuram</option>
      <option>Ajit Singh Nagar</option>
      <option>Payakapuram</option>
      <option>Satyanarayanapuram</option>
      <option>Krishna Lanka</option>
      <option>One Town</option>
    </select>

    <label>Select Ward</label>
    <select id="bdWard">
      <option value="">All Wards</option>
    </select>

    <input id="bdSearch" type="search"
      placeholder="Search products, shops, offers...">
  </div>

  <h3>Explore Categories</h3>
  <div id="bdCategories" class="bd-categories">
    <button data-category="">All Categories</button>
  </div>

  <div class="bd-result-heading">
    <h3 id="bdResultTitle">Latest Live Deals</h3>
    <span id="bdResultCount">Loading...</span>
  </div>

  <div id="bdDeals" class="bd-deals">
    Loading deals...
  </div>

  <div id="bdDashboardPanel" class="bd-dashboard-panel" hidden>
    <h3>My Dashboard</h3>
    <p id="bdUserInfo">Login to view your account details.</p>
    <div class="bd-dashboard-links">
      <button onclick="bdShowDeals()">View Deals</button>
      <button onclick="bdShowSaved()">Saved Deals</button>
      <button onclick="bdShowMyPosts()">My Posts</button>
    </div>
  </div>

</section>

<link rel="stylesheet" href="/marketplace.css">
<script src="/marketplace.js"></script>
</body>
</html>
