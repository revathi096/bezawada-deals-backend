<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijayawada All-in-One Local AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold">🏙️ Vijayawada Local AI Platform</h1>
        <a href="/admin" class="bg-rose-600 text-white px-3 py-1.5 rounded text-sm hover:bg-rose-700">Admin</a>
    </header>

    <!-- Controls Bar (Language & Mode) -->
    <div class="bg-white p-3 border-b border-gray-200 flex flex-wrap justify-center gap-4 shadow-sm">
        <div class="flex items-center gap-2">
            <label for="language" class="text-sm font-semibold">भाषा / Language:</label>
            <select id="language" class="border border-gray-300 rounded px-2 py-1 text-sm bg-white">
                <option value="Telugu">తెలుగు</option>
                <option value="English">English</option>
                <option value="Hindi">हिन्दी</option>
            </select>
        </div>
        <div class="flex items-center gap-2">
            <label for="mode" class="text-sm font-semibold">Mode:</label>
            <select id="mode" class="border border-gray-300 rounded px-2 py-1 text-sm bg-white">
                <option value="local_info">🏙️ Vijayawada Guide</option>
                <option value="code_assistant">💻 Code Assistant</option>
                <option value="data_analysis">📊 Data Analysis</option>
            </select>
        </div>
    </div>

    <!-- Chat Container -->
    <div id="chatContainer" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3 max-w-3xl mx-auto w-full">
        <div class="message assistant bg-white border border-gray-200 p-3 rounded-lg shadow-sm max-w-[80%] self-start">
            నమస్కారం! విజయవాడ లోకల్ సమాచారం, షాపులు, ఫుడ్, లేదా కోడింగ్ సహాయం కోసం నన్ను అడగండి. How can I help you today?
        </div>
    </div>

    <!-- Input Area -->
    <div class="bg-white p-4 border-t border-gray-200 flex justify-center gap-2 shadow-lg">
        <input type="text" id="userInput" placeholder="ఇక్కడ మీ ప్రశ్న టైప్ చేయండి (Type your question)..." 
            class="flex-1 max-w-2xl border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500"
            onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-semibold transition">
            Send
        </button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chatContainer");
            const language = document.getElementById("language").value;
            const mode = document.getElementById("mode").value;
            
            const text = inputField.value.trim();
            if (!text) return;

            // User Message
            chatContainer.innerHTML += `<div class="message user bg-blue-600 text-white p-3 rounded-lg max-w-[80%] self-end shadow-sm">${text}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading Indicator
            const loadingId = "loading-" + Date.now();
            chatContainer.innerHTML += `<div id="${loadingId}" class="message assistant bg-white border border-gray-200 p-3 rounded-lg shadow-sm max-w-[80%] self-start text-gray-500">Typing...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, language: language, mode: mode, session_id: "user-session-1" })
                });

                const data = await response.json();
                document.getElementById(loadingId).innerText = data.reply || data.detail || "సమాచారం అందడంలో లోపం ఏర్పడింది.";
                document.getElementById(loadingId).classList.remove("text-gray-500");
            } catch (error) {
                document.getElementById(loadingId).innerText = "సర్వర్ కనెక్షన్ లోపం (Server connection error)!";
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
